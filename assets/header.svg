<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Aditya Maurya: AI engineer · building AI that runs on your machine">
  <style>
    .s { fill: #fff; opacity: .15; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: .9; } }
    .t { font: 500 24px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace; fill: #c9d1d9; text-anchor: middle; opacity: 0;
          animation: cyc 9s ease-in-out infinite; }
    @keyframes cyc {
      0% { opacity: 0; transform: translateY(10px); }
      4.0%, 28.3% { opacity: 1; transform: translateY(0); }
      33.3%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#111729"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="fade"><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="70"/></filter>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle cx="260" cy="90" r="170" fill="#a78bfa" opacity=".45">
        <animateTransform attributeName="transform" type="translate" values="0 0;140 60;0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="260" r="170" fill="#22d3ee" opacity=".35">
        <animateTransform attributeName="transform" type="translate" values="0 0;-160 -50;0 0" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)"/>
    <circle class="s" cx="90" cy="70" r="1.2" style="animation-delay:0.00s"/>
    <circle class="s" cx="210" cy="250" r="1.7" style="animation-delay:0.37s"/>
    <circle class="s" cx="330" cy="110" r="2.2" style="animation-delay:0.74s"/>
    <circle class="s" cx="470" cy="290" r="1.2" style="animation-delay:1.11s"/>
    <circle class="s" cx="560" cy="60" r="1.7" style="animation-delay:1.48s"/>
    <circle class="s" cx="690" cy="270" r="2.2" style="animation-delay:1.85s"/>
    <circle class="s" cx="780" cy="95" r="1.2" style="animation-delay:2.22s"/>
    <circle class="s" cx="900" cy="240" r="1.7" style="animation-delay:2.59s"/>
    <circle class="s" cx="1010" cy="80" r="2.2" style="animation-delay:2.96s"/>
    <circle class="s" cx="1110" cy="200" r="1.2" style="animation-delay:0.33s"/>
    <circle class="s" cx="150" cy="170" r="1.7" style="animation-delay:0.70s"/>
    <circle class="s" cx="1060" cy="300" r="2.2" style="animation-delay:1.07s"/>
    <circle class="s" cx="620" cy="180" r="1.2" style="animation-delay:1.44s"/>
    <circle class="s" cx="400" cy="40" r="1.7" style="animation-delay:1.81s"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <circle class="dot" cx="48" cy="44" r="5" fill="#4ade80"/>
  <text x="62" y="49" style="font: 15px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace; fill: #8b949e;">currently building Kestrel</text>
  <text x="600" y="172" text-anchor="middle" fill="url(#shine)" style="font: 800 92px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -2px;">Aditya Maurya</text>
  <g>
    <text class="t" x="600" y="232" style="animation-delay:0s">AI engineer · building AI that runs on your machine</text>
    <text class="t" x="600" y="232" style="animation-delay:3s">on-device LLMs · RAG · knowledge graphs</text>
    <text class="t" x="600" y="232" style="animation-delay:6s">Rust · Python · Kotlin · TypeScript</text>
  </g>
  <text x="600" y="300" text-anchor="middle" style="font: 14px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace; fill: #8b949e; letter-spacing: 4px;">LOCAL-FIRST · PRIVATE BY DEFAULT · MEASURED</text>
</svg>
